[project]
site_name = "tusk"
site_description = "Deep feature synthesis for narwhals dataframes."
site_author = "Excidion"
copyright = "Copyright &copy; 2026 Excidion"
docs_dir="docs"
repo_url = "https://github.com/Excidion/tusk"
repo_name = "Excidion/tusk"
edit_uri = "edit/main/docs"

[[project.extra.social]]
icon = "fontawesome/brands/python"
link = "https://pypi.org/project/tusk-ml/"

nav = [
    "index.md",
    { "Guide" = [
        "guide/index.md",
        "guide/databases.md",
        "guide/deep-feature-synthesis.md",
        "guide/primitives.md",
        "guide/custom-primitives.md",
        "guide/sklearn.md",
        "guide/featuretools.md",
        "guide/primitive-coverage.md",
    ] },
    { "API reference" = [
        "api/index.md",
        "api/tusk.md",
        "api/database.md",
        "api/validation.md",
        "api/sklearn.md",
        "api/primitives.md",
        "api/features.md",
        "api/dtypes.md",
        "api/exceptions.md",
    ] },
]

[project.theme]
language = "en"
features = [
    "announce.dismiss",
    "content.action.edit",
    "content.action.view",
    "content.code.annotate",
    "content.code.copy",
    "content.code.select",
    "content.footnote.tooltips",
    "content.tabs.link",
    "content.tooltips",
    "navigation.indexes",
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.path",
    "navigation.sections",
    "navigation.top",
    "navigation.tracking",
    "search.highlight",
    "toc.follow",
]

[project.theme.icon]
logo = "lucide/columns-3-cog"
repo = "fontawesome/brands/github"

[project.plugins.mkdocstrings.handlers.python]
paths = ["src"]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "google"
show_source = false
show_root_heading = true
show_root_full_path = false
show_symbol_type_heading = true
show_symbol_type_toc = true
show_if_no_docstring = true
members_order = "source"
separate_signature = true
signature_crossrefs = true
merge_init_into_class = true
filters = ["!^_"]
heading_level = 3
