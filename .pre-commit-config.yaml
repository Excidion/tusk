repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
  - id: check-yaml
    args: ['--unsafe'] # avoid problems with mkdocs mermaid extension
  - id: check-toml
  - id: end-of-file-fixer
  - id: trailing-whitespace

- repo: https://github.com/jumanjihouse/pre-commit-hooks
  rev: '3.0.0'
  hooks:
  - id: forbid-binary

- repo: local
  hooks:
  - id: uv-lock
    name: uv-lock
    entry: uv lock
    language: python
    files: ^(uv\.lock|pyproject\.toml)$
    pass_filenames: false

  - id: ruff-check
    name: ruff-check
    entry: uv run ruff check
    args: [ --fix ]
    language: system
    types: [file, python]

  - id: ruff-format
    name: ruff-format
    entry: uv run ruff format
    language: system
    types: [file, python]

  - id: ty-check
    name: ty-check
    entry: uv run ty check
    language: system
    types: [file, python]

  - id: interrogate
    name: interrogate
    entry: uv run interrogate
    language: system
    types: [file, python]
    pass_filenames: false

  - id: pydoclint
    name: pydoclint
    entry: uv run pydoclint
    language: system
    types: [file, python]
